name: Build SRP Hub Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias srphub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass srphub123 \
            -keypass srphub123 \
            -dname "CN=SRP Hub, OU=SRP Team, O=SRP Team, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release-key.jks \
            -Pandroid.injected.signing.store.password=srphub123 \
            -Pandroid.injected.signing.key.alias=srphub \
            -Pandroid.injected.signing.key.password=srphub123

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SRPHub-release-apk
          path: app/build/outputs/apk/release/*.apk
